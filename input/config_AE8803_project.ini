[Simulation]
# min and max thrust (N)
Tmin = 0, 0
Tmax = 50, 50

# wet and dry spacecraft mass (kg). Mothership default 12, 11
m_wet = 10000, 5000
m_dry = 9500, 1000

# surface area (m^2). Mothership default 3.14
S = 3.14, 0.36

# number of states and number of controls
numstates = 7
m = 4

# specific impulse of thrusters (s)
isp = 225, 75

# Designations (no spaces!!!!!)
designations = mothership,daughtership1,daughtership2

# reference trajectory location
folder = apophis-reference-trajectories

# ESTIMATED initial position and velocity (km, km/s)
dxhat_0 = 0.0, 0.0
dyhat_0 = 0.0, 0.0
dzhat_0 = 0.0, 0.0
dvxhat_0 = 0.0, 0.0
dvyhat_0 = 0.0, 0.0
dvzhat_0 = 0.0, 0.0

# number of timesteps in MPC prediction horizon
horizon = 10, 10

# Covariance P diagonal entries (km^2, km^2/s^2, kg^2)
Px = 0.000004, 0.000004
Py = 0.000004, 0.000004
Pz = 0.000004, 0.000004
Pvx = 1e-12, 1e-12
Pvy = 1e-12, 1e-12
Pvz = 1e-12, 1e-12
Pq = 1e-16, 1e-16

# Process noise matrix Q diagonal entries (km^2, km^2/s^2, kg^2)
Qx = 1e-10, 1e-10
Qy = 1e-10, 1e-10
Qz = 1e-10, 1e-10
Qvx = 1e-15, 1e-15
Qvy = 1e-15, 1e-15
Qvz = 1e-15, 1e-15
Qq = 1e-20, 1e-20

# 1-sigma desired covariances (km^2, km^2/s^2, kg^2)
Sx = 2.5e-9, 2.5e-9
Sy = 2.5e-9, 2.5e-9
Sz = 2.5e-9, 2.5e-9
Svx = 2.5e-15, 2.5e-15
Svy = 2.5e-15, 2.5e-15
Svz = 2.5e-15, 2.5e-15
Sq = 1e-20, 1e-20

# measurement noise 1 sigma variance (pixels^2, pixels^2, km^2, km^2/s^2, km^2, km^2/s^2) (1e-12 for km^2/s^2) 0.01, 0.01, 2e-10, 0.01, 0.01, 2e-10
v = 0.01, 0.01, 0.01, 0.01, 2e-10
v_start = 0, 2
v_end = 2, 5

# thruster noise 1 sigma std as a percent of the thrust magnitude (%)
dv_error_percent = 1

# camera field of view, always pointed to asteroid CoM (degrees)
fov = 24

# focal length (mm)
f = 12

# pixel size/pitch (px/mm)
pixel_pitch = 0.00325

# camera size (pixels)
width = 1024
height = 1024

# select which cost function to use: "fixed", "terminal_free", "terminal_fuel_weighted_free" "progress_free", "no_fuel_free", "progress_ones_free"
cost_function_to_use = terminal_fuel_weighted_free

# Monte Carlo? 1 means you are doing Monte Carlo sims, so you want the initial conditions varied. Sigmas are 1 sigma values (km, km/s) to vary the ICs around with a mean value of the reference trajectory ICs
monte_carlo_bool = 0
monte_carlo_pos_x_sigma = 4.444e-5, 4.444e-5
monte_carlo_pos_y_sigma = 4.444e-5, 4.444e-5
monte_carlo_pos_z_sigma = 4.444e-5, 4.444e-5
monte_carlo_pos_vx_sigma = 1.111e-9, 1.111e-9
monte_carlo_pos_vy_sigma = 1.111e-9, 1.111e-9
monte_carlo_pos_vz_sigma = 1.111e-9, 1.111e-9

# generate (0) or use existing reference trajectories (1)
ref_traj_setting = 0, 0

# generate (0) or use existing initial conditions (1) if generating reference trajectories
ics_gen_setting = 0, 0

# initial states (if generating reference trajectories and want prescribed initial conditions (0, 1 above), km, km/s)
x_0 = 0.076682698079531611, -0.033925557289467306
y_0 = 1.1639106787116784, -0.46863942173963041
z_0 = -3.1132672756505015, 1.2804714780349655
vx_0 = -0.000028941236213087830, 0.000039626490887801602
vy_0 = -0.0000068574735702273788, 0.0000093892884168185679
vz_0 = -0.0000032765509327547089, 0.0000044862705492002076

# initial radius, true anomaly if generating initial conditions (km, rad)
r_0 = 1, 1
ta_0 = 1.570796327, 0
t_0 = 0, 0

# number of steps and time step (if generating reference trajectories, unitless, seconds)
N = 300
N_ref = 600
dt = 5
dt_ref = 1

# multiplier to apply to dt for the MPC horizon to step in a single step: mult = 4 -> 1 step in MPC = 4*dt
dt_MPC_multiplier = 4

# deltaV minimum as a multiple of gates sigma_1
gates_1_factor = 3

# ephemeris BSpline interpolation order k > 0
k = 7, 7

# number of range measurements per batch
N_batch = 16

# reflectivity coefficient (C_R) [1, 2]   0.857
C_R = 1.2, 1.2

# daughtership measurement model "range_range_rate", "image", "image_range"
model = image_range

# orbit classification "terminator", "halo"
orbit = halo,halo

[Asteroid]
# asteroid names: bennu, kleopatra, geographos, bacchus, toutatis, castalia, golevka, itokawa, apophis
asteroid = apophis

# number of features on asteroid
fnum = 600

[Gates]
# standard deviations for the Gates model: fixed and proportional-magnitude errors (1 and 2) and fixed and proportional-pointing errors (3 and 4) based on Cassini Maneuver Performance Assessment RCS thrusters
# units: km/s, %, mm/s, mrad
s1 = 0.00000085, 0.00000085
s2 = 0, 0
s3 = 0, 0
s4 = 4.3, 4.3
