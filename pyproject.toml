[tool.poetry]
name = "asteroidproxops"
version = "0.1.0"
description = "Asteroid landing and proximity operation code for the NSTGRO fellowship work: Autonomous Landing and Proximity Operation Technology for Poorly-Characterized Small Bodies"
authors = ["lfeld3 <lfeld3@gatech.edu>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.10"
clarabel = "0.9.0"
cvxpy = "1.5.2"
matplotlib = "^3.9"
numpy = "^2"
pytest = "^7"
scipy = "^1.13"
pyyaml = "^6.0.2"
lark = "^1.2.2"
jax = "0.4.30"
interpax = "0.3.7"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
